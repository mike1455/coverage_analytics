<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аналитика покрытия</title>
  <meta name="description" content="Локальная аналитика: обслуживание домов Москвы в ЕДЦ по реестру МЖИ и заявки 2026 года">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232a78d6' stroke-width='6' stroke-dasharray='40 100'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230ca30c' stroke-width='6' stroke-dasharray='0 42 30 100'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/geoman/leaflet-geoman.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Тема до отрисовки, чтобы не мигало
    try { var t = localStorage.getItem('mca-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div class="app" id="app">
    <nav class="nav" aria-label="Разделы">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span data-icon="map"></span></div>
        <div class="brand-text">
          <div class="brand-title">Аналитика покрытия</div>
          <div class="brand-sub">Москва, ЕДЦ, МЖИ</div>
        </div>
      </div>
      <button class="nav-item" data-view="summary"><span data-icon="grid"></span><span class="label">Сводка</span></button>
      <button class="nav-item" data-view="map"><span data-icon="map"></span><span class="label">Карта домов</span></button>
      <button class="nav-item" data-view="activity"><span data-icon="activity"></span><span class="label">Активность заявок</span></button>
      <button class="nav-item" data-view="regions"><span data-icon="chart"></span><span class="label">Округа и районы</span></button>
      <button class="nav-item" data-view="houses"><span data-icon="building"></span><span class="label">Дома и подъезды</span></button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-view="import"><span data-icon="database"></span><span class="label">Импорт и качество данных</span></button>
      <div class="nav-status" id="nav-status"></div>
    </nav>

    <div class="main">
      <header class="topbar" id="topbar"></header>
      <div class="views" id="views">
        <section class="view" id="view-summary" aria-label="Сводка"></section>
        <section class="view view-map" id="view-map" aria-label="Карта домов"></section>
        <section class="view view-activity" id="view-activity" aria-label="Активность заявок"></section>
        <section class="view" id="view-regions" aria-label="Округа и районы"></section>
        <section class="view" id="view-houses" aria-label="Дома и подъезды"></section>
        <section class="view" id="view-import" aria-label="Импорт и качество данных"></section>
      </div>
    </div>
  </div>

  <aside class="drawer" id="drawer" aria-label="Карточка дома"></aside>

  <noscript>Для работы приложения нужен JavaScript.</noscript>
  <div id="file-protocol" class="hidden" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--page);z-index:9999;padding:24px">
    <div class="card" style="max-width:640px">
      <h2>Откройте приложение через локальный сервер</h2>
      <p style="margin-top:10px">Браузер не разрешает модулям и Web Worker работать со страницы, открытой как файл. Запустите в папке приложения:</p>
      <pre class="raw">py -3 serve.py</pre>
      <p>и откройте <b>http://localhost:8000</b>. На Windows достаточно дважды щёлкнуть start.bat.</p>
    </div>
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-protocol').classList.remove('hidden');
  </script>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/geoman/leaflet-geoman.min.js"></script>
  <script src="vendor/protomaps/protomaps-leaflet.js"></script>
  <script src="vendor/osmtogeojson/osmtogeojson.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
